name: Site snapshot

on:
  schedule:
    - cron: '0 11 * * 1'        # Mondays 11:00 UTC = 7am ET (6am during standard time)
  workflow_dispatch:
    inputs:
      pages:
        description: 'Optional: comma-separated paths to limit the run, e.g. /,/contact-us'
        required: false
        default: ''
  repository_dispatch:
    types: [site-deployed]      # fired by the site repo after a production deploy (optional)

permissions:
  contents: write

concurrency:
  group: site-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test

      - name: Fetch previous snapshot for diffs
        run: |
          git fetch origin snapshots:snapshots 2>/dev/null && git worktree add previous snapshots || echo "no previous snapshot yet"

      - name: Render + analyze
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.rma-engineering.com' }}
          OUT_DIR: out/latest
          PREV_DIR: previous/latest
          ONLY_PAGES: ${{ inputs.pages }}
        run: node scripts/snapshot.mjs

      - name: Publish to the snapshots branch (orphan, so the repo never bloats)
        if: github.ref == 'refs/heads/main'    # branch test runs (gh workflow run --ref <branch>) must not replace the live gallery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          printf '<meta http-equiv="refresh" content="0; url=latest/">' > index.html
          touch .nojekyll
          git init -q -b snapshots
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" snapshots

      - name: Keep a 90-day archive of this run
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: out
          retention-days: 90

      - name: Summary
        run: |
          echo "## Snapshot summary" >> $GITHUB_STEP_SUMMARY
          sed -n '1,60p' out/latest/report.md >> $GITHUB_STEP_SUMMARY
