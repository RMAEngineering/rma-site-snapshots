name: Site snapshot

on:
  schedule:
    - cron: '0 11 * * 1'        # Mondays 11:00 UTC = 7am ET (6am during standard time)
  workflow_dispatch:
    inputs:
      pages:
        description: 'Optional: comma-separated paths to limit the run, e.g. /,/contact-us'
        required: false
        default: ''
  repository_dispatch:
    types: [site-deployed]      # fired by the site repo after a production deploy (optional)

permissions:
  contents: write

concurrency:
  group: site-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test

      - name: Fetch previous snapshot for diffs
        run: |
          git fetch origin snapshots:snapshots 2>/dev/null && git worktree add previous snapshots || echo "no previous snapshot yet"

      - name: Render + analyze
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.rma-engineering.com' }}
          OUT_DIR: out/latest
          PREV_DIR: previous/latest
          ONLY_PAGES: ${{ inputs.pages }}
        run: node scripts/snapshot.mjs

      # ---- Weekly traffic report (Vercel Web Analytics). The publish step below replaces the snapshots branch with out/
      # wholesale (out/latest -> latest/, out/history -> history/), so everything here writes into out/, and the history
      # is copied forward from the previous run on EVERY trigger — anything not copied is gone after the push.
      - name: Carry traffic history forward
        run: |
          mkdir -p out/history/traffic
          cp previous/history/traffic/*.json out/history/traffic/ 2>/dev/null || echo "no traffic history yet"

      - name: Weekly traffic report
        # fresh numbers on the Monday schedule and on a plain manual run; a post-deploy run (repository_dispatch) or a
        # page-limited manual run does not query Vercel and reuses the previous report (next step)
        id: traffic
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pages == '')
        continue-on-error: true     # a Vercel problem must never block the snapshot publish; the script reports it as DATA_GAP
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Google sources (GA4 + Search Console) are optional: with any of these missing the report says "not configured"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          OUT_DIR: out/latest
          HISTORY_DIR: out/history/traffic
        run: node scripts/traffic.mjs

      - name: Carry the previous traffic report forward
        if: steps.traffic.outcome != 'success'     # skipped (post-deploy / page-limited run) or failed outright
        run: |
          mkdir -p out/latest
          cp previous/latest/traffic.json previous/latest/traffic.md out/latest/ 2>/dev/null || echo "no previous traffic report"

      - name: Publish to the snapshots branch (orphan, so the repo never bloats)
        if: github.ref == 'refs/heads/main'    # branch test runs (gh workflow run --ref <branch>) must not replace the live gallery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          printf '<meta http-equiv="refresh" content="0; url=latest/">' > index.html
          touch .nojekyll
          git init -q -b snapshots
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" snapshots

      - name: Keep a 90-day archive of this run
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: out
          retention-days: 90

      - name: Summary
        run: |
          echo "## Snapshot summary" >> $GITHUB_STEP_SUMMARY
          sed -n '1,60p' out/latest/report.md >> $GITHUB_STEP_SUMMARY
          if [ -f out/latest/traffic.md ]; then { echo; cat out/latest/traffic.md; } >> $GITHUB_STEP_SUMMARY; fi
